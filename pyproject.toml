[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "focuslog"
version = "0.1.0"
description = "A tiny local task tracking CLI"
requires-python = ">=3.10"

[project.scripts]
focuslog = "focuslog.cli:main"

[tool.setuptools.packages.find]
include = ["focuslog*"]
